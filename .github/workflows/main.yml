name: Build Geode Mod
on:
  workflow_dispatch:
  push:
    branches: ["**"]
permissions:
  contents: write
jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: Win64
      - name: Upload the .geode file
        uses: actions/upload-artifact@v4
        with:
          name: learnbot
          path: ${{ steps.build.outputs.build-output }}/*.geode
